apiVersion: agentland.fl0rencess720.app/v1alpha1
kind: AgentRuntime
metadata:
  labels:
    app.kubernetes.io/name: agentland
    app.kubernetes.io/managed-by: kustomize
  name: default-runtime
  namespace: agentland-sandboxes
spec:
  sandboxTemplate:
    image: fl0rences720/agentland-agentd:latest
    env:
      - name: AL_AGENT_MODEL
        value: replace-with-model-id
      - name: AL_AGENT_MODEL_BASE_URL
        value: https://api.openai.com/v1
      - name: AL_AGENT_MODEL_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentd-model
            key: api-key
