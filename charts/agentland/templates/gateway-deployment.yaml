{{- if .Values.gateway.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentland.componentName" (dict "root" . "name" .Values.gateway.deployment.name) }}
  namespace: {{ .Values.namespaces.system }}
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: agentland
spec:
  replicas: {{ .Values.gateway.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: agentland
    spec:
      serviceAccountName: {{ include "agentland.componentName" (dict "root" . "name" .Values.gateway.serviceAccount.name) }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: "{{ .Values.gateway.deployment.image.repository }}:{{ .Values.gateway.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.deployment.image.pullPolicy }}
          args:
{{ toYaml .Values.gateway.deployment.args | indent 12 }}
          env:
            - name: AL_REDIS_ADDR
              value: {{ default (printf "%s:%v" (include "agentland.componentName" (dict "root" . "name" .Values.redis.service.name)) .Values.redis.service.port) .Values.gateway.deployment.env.AL_REDIS_ADDR | quote }}
            - name: AL_REDIS_PASSWORD
              value: {{ .Values.gateway.deployment.env.AL_REDIS_PASSWORD | quote }}
            - name: AL_REDIS_DB
              value: {{ .Values.gateway.deployment.env.AL_REDIS_DB | quote }}
            - name: AL_AGENTCORE_ADDRESS
              value: {{ default (printf "%s:%v" (include "agentland.componentName" (dict "root" . "name" .Values.agentcore.agentcoreService.name)) .Values.agentcore.agentcoreService.port) .Values.gateway.deployment.env.AL_AGENTCORE_ADDRESS | quote }}
            - name: AL_OTEL_ENABLED
              value: {{ .Values.gateway.deployment.env.AL_OTEL_ENABLED | quote }}
            - name: AL_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.gateway.deployment.env.AL_OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
            - name: AL_OTEL_EXPORTER_OTLP_INSECURE
              value: {{ .Values.gateway.deployment.env.AL_OTEL_EXPORTER_OTLP_INSECURE | quote }}
            - name: AL_OTEL_TRACES_SAMPLE_RATIO
              value: {{ .Values.gateway.deployment.env.AL_OTEL_TRACES_SAMPLE_RATIO | quote }}
            - name: AL_GATEWAY_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AL_SANDBOX_JWT_ISSUER
              value: {{ default (include "agentland.componentName" (dict "root" . "name" .Values.gateway.service.name)) .Values.gateway.deployment.env.AL_SANDBOX_JWT_ISSUER | quote }}
            - name: AL_SANDBOX_JWT_AUDIENCE
              value: {{ .Values.gateway.deployment.env.AL_SANDBOX_JWT_AUDIENCE | quote }}
            - name: AL_SANDBOX_JWT_TTL
              value: {{ .Values.gateway.deployment.env.AL_SANDBOX_JWT_TTL | quote }}
            - name: AL_SANDBOX_JWT_KID
              value: {{ .Values.gateway.deployment.env.AL_SANDBOX_JWT_KID | quote }}
            - name: AL_PUBLISHER_ENABLED
              value: {{ .Values.gateway.publisher.enabled | quote }}
            - name: AL_BUILDKIT_ADDRESS
              value: {{ .Values.gateway.publisher.buildkitAddress | quote }}
            - name: AL_BUILDKIT_ALLOW_INSECURE
              value: {{ .Values.gateway.publisher.allowInsecureBuildkit | quote }}
            - name: AL_BUILDKIT_PLATFORM
              value: {{ .Values.gateway.publisher.platform | quote }}
            - name: AL_BUILDKIT_TIMEOUT
              value: {{ .Values.gateway.publisher.timeout | quote }}
            - name: AL_REGISTRY_REPOSITORY_PREFIX
              value: {{ .Values.gateway.publisher.repositoryPrefix | quote }}
{{- if .Values.gateway.publisher.enabled }}
            - name: AL_PUBLISHER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.publisher.serviceTokenSecret is required when publishing is enabled" .Values.gateway.publisher.serviceTokenSecret | quote }}
                  key: {{ .Values.gateway.publisher.serviceTokenSecretKey | quote }}
{{- end }}
{{- if .Values.gateway.publisher.registryCredentialsSecret }}
            - name: AL_REGISTRY_DOCKER_CONFIG
              value: /home/apiserver/.docker
{{- end }}
{{- if .Values.gateway.publisher.buildkitTLSSecret }}
            - name: AL_BUILDKIT_CA_CERT
              value: /var/run/secrets/agentland/buildkit/ca.pem
            - name: AL_BUILDKIT_CLIENT_CERT
              value: /var/run/secrets/agentland/buildkit/cert.pem
            - name: AL_BUILDKIT_CLIENT_KEY
              value: /var/run/secrets/agentland/buildkit/key.pem
{{- end }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.gateway.deployment.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
{{- if .Values.gateway.publisher.registryCredentialsSecret }}
            - name: registry-credentials
              mountPath: /home/apiserver/.docker/config.json
              subPath: .dockerconfigjson
              readOnly: true
{{- end }}
{{- if .Values.gateway.publisher.buildkitTLSSecret }}
            - name: buildkit-mtls
              mountPath: /var/run/secrets/agentland/buildkit
              readOnly: true
{{- end }}
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 512Mi
{{- if .Values.gateway.publisher.registryCredentialsSecret }}
        - name: registry-credentials
          secret:
            secretName: {{ .Values.gateway.publisher.registryCredentialsSecret | quote }}
{{- end }}
{{- if .Values.gateway.publisher.buildkitTLSSecret }}
        - name: buildkit-mtls
          secret:
            secretName: {{ .Values.gateway.publisher.buildkitTLSSecret | quote }}
{{- end }}
{{- end }}
